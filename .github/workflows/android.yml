# 안드로이드 앱(APK) 자동 빌드.
# main에 올라올 때마다 웹 코드를 앱으로 감싸서 굽고, "android-test" 릴리스에 설치 파일을 올린다.
# 폰에서 받는 주소: https://github.com/Leeseunggyu3/toilet-adventurer/releases/download/android-test/ToiletAdventure.apk
name: android
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'supabase/**', 'tools/**', 'tests/live.check.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Copy web files into the app
        run: node scripts/copy-web.mjs "$(git rev-parse --short HEAD)"
      - name: Create Android project
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          # 공용 저장소(Maven Central)가 가끔 일시적으로 실패해서 한 번 더 시도한다
          ./gradlew --no-daemon assembleDebug || { sleep 45; ./gradlew --no-daemon --refresh-dependencies assembleDebug; }
          cp app/build/outputs/apk/debug/app-debug.apk ../ToiletAdventure.apk
          ls -la ../ToiletAdventure.apk
      - name: Publish to the android-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }} ($(git rev-parse --short HEAD))"
          NOTES="시험용 안드로이드 앱 ${V}. 폰에서 ToiletAdventure.apk를 받아 설치하세요. 새 버전은 지우지 않고 덮어 설치하면 됩니다."
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test ToiletAdventure.apk --clobber
            gh release edit android-test --title "안드로이드 시험판 ${V}" --notes "$NOTES" --prerelease
          else
            gh release create android-test ToiletAdventure.apk --title "안드로이드 시험판 ${V}" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToiletAdventure-apk
          path: app/ToiletAdventure.apk
          retention-days: 14
