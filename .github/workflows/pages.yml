name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium
      - name: SQL rule test (real Postgres via PGlite)
        run: |
          npm install @electric-sql/pglite@0.5 >/dev/null
          node tests/sql.test.mjs
      - name: Smoke test
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.mjs
  deploy:
    needs: test          # 점검이 실패하면 배포하지 않는다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version (캐시 무효화 + 앱에 버전 표시)
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i -E "s#\?v=[0-9a-z]+\"#?v=$V\"#g" index.html
          sed -i "s#__VERSION__#$V#" app.js
          sed -i -E "s#ghc-shell-[0-9a-z]+#ghc-shell-$V#" sw.js
          rm -rf tests supabase .github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
