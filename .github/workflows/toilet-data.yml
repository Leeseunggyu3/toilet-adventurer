name: Refresh toilet data
# 일주일에 한 번 Geofabrik의 한국·일본 OpenStreetMap 파일에서 화장실만 골라 toilet-data 브랜치에 올리고, 사이트를 다시 배포한다.
# (Overpass 공용 서버에 대량으로 묻지 않는다. 대량 다운로드는 Geofabrik 파일을 쓰는 것이 올바른 방법이다)
# 받다가 문제가 생기면(너무 적게 받음 등) 발행하지 않으므로 지난주 데이터가 그대로 유지된다.
on:
  schedule:
    - cron: '17 18 * * 0'   # 매주 월요일 03:17 (한국·일본 시간)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: toilet-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyosmium
        run: pip install osmium
      - name: Download OpenStreetMap country files (Geofabrik)
        run: |
          mkdir -p pbf && cd pbf
          # 파일은 매일 새로 바뀌므로, 체크섬을 먼저 받고 파일을 받은 뒤 맞는지 확인한다. 받는 사이에 바뀌었으면 다시 받는다
          for r in south-korea japan; do
            ok=0
            for try in 1 2 3; do
              curl -fsSL --retry 5 --retry-delay 30 -o $r.osm.pbf.md5 https://download.geofabrik.de/asia/$r-latest.osm.pbf.md5
              curl -fsSL --retry 5 --retry-delay 30 -o $r.osm.pbf https://download.geofabrik.de/asia/$r-latest.osm.pbf
              if echo "$(cut -d' ' -f1 $r.osm.pbf.md5)  $r.osm.pbf" | md5sum -c -; then ok=1; break; fi
              echo "$r: 체크섬이 맞지 않음 (받는 중에 새 파일로 바뀌었을 수 있음). 2분 뒤 다시 받기 ($try/3)"
              sleep 120
            done
            [ $ok = 1 ] || { echo "$r: 세 번 모두 체크섬 불일치"; exit 1; }
          done
          ls -lh
      - name: Pick out toilets and split into tiles
        run: python tools/build_toilet_data.py out pbf/south-korea.osm.pbf pbf/japan.osm.pbf
      - name: Publish to toilet-data branch (history kept to one commit)
        run: |
          cd out
          git init -q -b toilet-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "toilet data $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" toilet-data
      - name: Redeploy site with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
